<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icone.svg">
<title>Mukifo · Fila da sinuca</title><script src="/tema.js"></script>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:18px system-ui,sans-serif}
header{background:var(--hdr);padding:12px 14px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px;flex:1}
header a,.nav button{color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;text-decoration:none;font:inherit;font-size:15px;cursor:pointer}
.nav{display:flex;gap:8px;padding:10px 12px;max-width:760px;margin:0 auto}.nav button{flex:1;justify-content:center}.nav button[aria-pressed=true]{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:700}
main{max-width:760px;margin:0 auto;padding:0 12px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 6px}.mut{color:var(--mut);font-size:14px}.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;background:var(--input);border:1px solid var(--line);margin-right:6px}
.btn{width:100%;min-height:54px;border-radius:14px;border:0;font-size:18px;font-weight:700;background:var(--acc);color:var(--on-acc);cursor:pointer;margin-top:8px}.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line);font-weight:500;font-size:16px}.btn:disabled{opacity:.5}
.mod{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:12px 0;cursor:pointer}.mod:first-of-type{border-top:0}.mod b{font-size:19px}
.chave{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}.rod{min-width:210px;display:flex;flex-direction:column;justify-content:space-around;gap:10px;scroll-snap-align:start}.rod>h4{margin:0;text-align:center;color:var(--mut);font-size:14px;letter-spacing:.05em}
.jg{background:var(--input);border:1px solid var(--line);border-radius:12px;overflow:hidden}.jg.vivo{border-color:var(--warn,#ffb347);box-shadow:0 0 0 2px var(--warn,#ffb347)}.jg .l{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;font-size:16px}.jg .l+.l{border-top:1px solid var(--line)}.jg .l.v{font-weight:800;color:var(--ok)}.jg .l.vazio{color:var(--mut);font-style:italic}.jg .m{font-size:12px;color:var(--mut);padding:0 10px 6px}
.pos{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.pos:first-of-type{border-top:0}.pos .n{width:34px;font-weight:800;text-align:center}.pos .p{flex:1;min-width:0;overflow-wrap:anywhere}.pos .pt{font-weight:800}
select,input{width:100%;min-height:50px;font-size:18px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--txt)}#msg{position:fixed;left:12px;right:12px;bottom:12px;background:var(--hdr);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;z-index:9}
.erro{color:var(--bad)}.pixbox{text-align:center}.pixbox img{width:min(260px,70vw);border-radius:12px;background:#fff;padding:8px}.pixbox code{display:block;word-break:break-all;font-size:12px;margin:8px 0;color:var(--mut);max-height:64px;overflow:hidden}
.big{font-size:46px;font-weight:900;text-align:center;margin:6px 0}.mesa{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 0}.mesa:first-of-type{border-top:0}.st{border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;background:var(--input);border:1px solid var(--line)}.st.livre{color:var(--ok,#3ddc84)}.st.ocupada,.st.liberando{color:var(--warn,#ffb347)}.st.chamando{color:var(--acc)}.btn.pq{min-height:44px;font-size:16px;width:auto;padding:0 16px;margin:0}.btn.ruim{background:var(--bad,#e5484d);color:#fff}</style></head><body data-sem-botao-visual>
<header><h1>🎱 Fila da sinuca</h1><a href="/campeonato.html">🏆</a><a href="/cliente.html">🍸</a></header>
<main id="m" style="padding-top:12px"><div class="card mut">Carregando…</div></main><div id="msg" hidden></div>
<script>
const $ = (s) => document.querySelector(s), esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let conta = null; try { conta = JSON.parse(localStorage.getItem('mukifo_conta') || 'null'); } catch {}
let est = null, ultimoStatus = null;
async function api(url, corpo) {
  const r = await fetch(url, { method: corpo ? 'POST' : 'GET', headers: { 'content-type': 'application/json', ...(conta?.token ? { 'X-Sessao-Cliente': conta.token } : {}) }, body: corpo ? JSON.stringify(corpo) : undefined });
  const j = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(j.erro || 'Erro ' + r.status); e.status = r.status; throw e; } return j;
}
const aviso = (t) => { const m = $('#msg'); m.textContent = t; m.hidden = false; clearTimeout(aviso.t); aviso.t = setTimeout(() => (m.hidden = true), 4000); };
const local = () => new Promise((ok, no) => {
  if (!navigator.geolocation) return no(new Error('Este aparelho não tem localização.'));
  navigator.geolocation.getCurrentPosition((p) => ok({ lat: p.coords.latitude, lng: p.coords.longitude, precisao: p.coords.accuracy }),
    () => no(new Error('Ative a localização do celular e permita para este site.')), { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
});
const ROT = { livre: 'Livre', chamando: 'Chamando', ocupada: 'Em jogo', liberando: 'Terminando…' };
async function assinarPush() { try {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  if (Notification.permission === 'default') await Notification.requestPermission(); if (Notification.permission !== 'granted') return;
  const { chave } = await (await fetch('/api/cliente/push-chave')).json(); if (!chave) return;
  const reg = await navigator.serviceWorker.ready, b = (x) => Uint8Array.from(atob(x.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b(chave) });
  await api('/api/sinuca/push', sub.toJSON()); } catch {} }
function desenhar() {
  const d = est, m = d.minha;
  if (m && ultimoStatus !== m.status && m.status === 'chamado') { try { navigator.vibrate?.([400, 150, 400, 150, 400]); } catch {} aviso('🎱 É a sua vez! Vá até a mesa.'); }
  ultimoStatus = m?.status ?? null;
  const cond = d.conduta ? `<div class="mut">Sua conduta na fila: <b>${esc(d.conduta.nivel)}</b>${d.conduta.bloqueado_ate ? ' · sem acesso até ' + new Date(d.conduta.bloqueado_ate.replace(' ', 'T') + 'Z').toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : ''}</div>` : '';
  let topo;
  if (!conta) topo = `<div class="card"><h2>Entre para usar a fila</h2><p class="mut">A fila é só para quem tem cadastro no Mukifo. Isso evita nome falso e brincadeira com a lista.</p><a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="/cliente.html">Entrar ou cadastrar</a></div>`;
  else if (!d.ativa) topo = '<div class="card"><b>A fila está desligada agora.</b></div>';
  else if (!m) topo = `<div class="card"><h2>Entrar na fila</h2><label class="mut">Nome que aparece na lista</label><input id="nome" maxlength="30" value="${esc(conta?.cliente?.nome?.split(' ').slice(0, 2).join(' ') || '')}"><button class="btn" data-a="entrar">📍 Entrar na fila</button><p class="mut">Usamos a sua localização só para confirmar que você está no bar (até ${d.raio_m} m). Ela não fica guardada.</p>${cond}</div>`;
  else if (m.status === 'chamado') topo = `<div class="card" style="border-color:var(--acc)"><h2>🎱 É a sua vez!</h2><div class="big">${esc(m.mesa?.nome || '')}</div><p class="mut" style="text-align:center">Chegue até a mesa em ${d.chegada_min} min${m.expira_em ? ' (<span id="rest"></span>)' : ''}.</p><button class="btn" data-a="cheguei">✅ Cheguei na mesa</button><button class="btn sec" data-a="sair">Desistir (perde pontos de conduta)</button></div>`;
  else if (m.status === 'jogando') topo = `<div class="card"><h2>Você está jogando na ${esc(m.mesa?.nome || '')}</h2><p class="mut">Quando terminar, libere a mesa para o próximo.</p><button class="btn" data-a="terminei" data-mesa="${esc(m.mesa?.id)}">Terminei, liberar a mesa</button></div>`;
  else topo = `<div class="card"><h2>Você é o nº ${m.pos} da fila</h2><div class="mut">Espera estimada: cerca de ${m.espera_min} min. Deixe o celular com a tela ligada ou aceite as notificações: avisamos quando for a sua vez.</div><button class="btn sec" data-a="avisos">🔔 Ativar avisos</button><button class="btn sec" data-a="sair">Sair da fila</button>${cond}</div>`;
  const mesas = d.mesas.length ? d.mesas.map((x) => `<div class="mesa"><div><b>${esc(x.nome)}</b><div class="mut">${x.jogador ? esc(x.jogador) : ''}${x.liberando ? ' · alguém avisou que terminou' : ''}</div></div><div style="display:flex;gap:8px;align-items:center"><span class="st ${x.status}">${ROT[x.status]}</span>${conta && !m && (x.status === 'ocupada' || x.status === 'liberando') && !x.meu ? `<button class="btn sec pq" data-a="terminou" data-mesa="${esc(x.id)}">Terminou</button>` : ''}${x.status === 'liberando' && m?.status === 'jogando' && x.meu ? `<button class="btn sec pq" data-a="ainda" data-mesa="${esc(x.id)}">Ainda jogando</button>` : ''}</div></div>`).join('') : '<div class="mut">Nenhuma mesa cadastrada ainda.</div>';
  const fila = d.fila.length ? d.fila.map((f) => `<div class="pos"><span class="n">${f.pos}º</span><span class="p">${esc(f.nome)}${f.eu ? ' <span class="chip">você</span>' : ''}</span></div>`).join('') : '<div class="mut">Ninguém esperando.</div>';
  $('#m').innerHTML = `${topo}<div class="card"><h3>Mesas</h3>${mesas}${conta && !m ? '<div class="mut" style="margin-top:8px">Viu uma mesa vazia que aparece como “em jogo”? Toque em “Terminou”. Avisos falsos custam pontos de conduta.</div>' : ''}</div><div class="card"><h3>Fila (${d.fila.length})</h3>${fila}</div>`;
  relogio();
}
async function carregar() { try { est = await api('/api/sinuca'); desenhar(); } catch (e) { if (e.status === 401) { conta = null; try { localStorage.removeItem('mukifo_conta'); } catch {} } $('#m').innerHTML = `<div class="card erro">${esc(e.message)}</div>`; } }
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-a]'); if (!t) return; const a = t.dataset.a; t.disabled = true;
  try {
    if (a === 'entrar' || a === 'cheguei' || a === 'terminou' || a === 'terminei') {
      let pos = {}; if (a !== 'terminei') { aviso('Conferindo sua localização…'); pos = await local(); }
      if (a === 'entrar') { est = await api('/api/sinuca/entrar', { nome: $('#nome').value, ...pos }); assinarPush(); }
      else if (a === 'cheguei') est = await api('/api/sinuca/cheguei', pos);
      else est = await api(`/api/sinuca/mesas/${t.dataset.mesa}/terminou`, pos);
      aviso(a === 'entrar' ? 'Você está na fila 🎱' : 'Pronto!');
    } else if (a === 'sair') { if (!confirm('Sair da fila?')) { t.disabled = false; return; } est = await api('/api/sinuca/sair', {}); }
    else if (a === 'ainda') est = await api(`/api/sinuca/mesas/${t.dataset.mesa}/ainda-jogando`, {});
    else if (a === 'avisos') { await assinarPush(); aviso(Notification.permission === 'granted' ? 'Avisos ativados 🔔' : 'Permita as notificações no navegador.'); }
    desenhar();
  } catch (er) { aviso(er.message); }
  t.disabled = false;
});
const relogio = () => { const r = $('#rest'); if (r && est?.minha?.expira_em) { const s = Math.max(0, Math.round((new Date(est.minha.expira_em) - Date.now()) / 1000)); r.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; } };
setInterval(() => { if (!document.hidden) carregar(); }, 5000); setInterval(relogio, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) carregar(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
carregar();
</script></body></html>

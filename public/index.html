<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Mukifo</title>
  <script src="/tema.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: var(--bg); color: var(--txt);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    main { text-align: center; }
    .status { font-size: 14px; color: var(--mut); }
    .ok { color: var(--ok); }
    .erro { color: var(--bad); }
  </style>
</head>
<body>
  <main>
    <div id="status" class="status">Abrindo o Mukifo…</div>
  </main>
  <script>
    try {
      location.replace(localStorage.getItem('mukifo_sessao') ? '/inicio.html' : '/entrar.html');
    } catch {
      location.replace('/entrar.html');
    }
    fetch("/api/saude")
      .then(r => r.json())
      .then(d => {
        const el = document.getElementById("status");
        el.textContent = `Servidor no ar · versão ${d.versao} · banco: ${d.banco}`;
        el.classList.add("ok");
      })
      .catch(() => {
        const el = document.getElementById("status");
        el.textContent = "Servidor fora do ar";
        el.classList.add("erro");
      });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Mukifo</title>
  <script src="/tema.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: var(--bg); color: var(--txt);
      font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    main { max-width: 420px; width: 100%; text-align: center; }
    h1 { font-size: 44px; letter-spacing: .06em; margin: 0 0 4px; }
    p { color: var(--mut); margin: 0 0 24px; }
    .menu { display:grid; gap:12px; margin:24px 0; } .grande { display:flex; align-items:center; justify-content:center; min-height:68px; border-radius:16px; background:var(--acc); color:var(--on-acc); font-size:22px; font-weight:700; text-decoration:none; } .grande:active { transform:scale(.97); }
    .status { font-size: 14px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; }
    .ok { color: var(--ok); border-color: var(--ok-bd); }
    .erro { color: var(--bad); border-color: var(--bad-bd); }
  </style>
</head>
<body>
  <main>
    <h1>MUKIFO</h1>
    <p>Sistema do bar — em construção</p>
    <div id="status" class="status">Verificando o servidor…</div>
    <nav class="menu">
      <a class="grande" href="/venda.html">🍸 Venda (balcão)</a>
      <a class="grande" href="/producao.html">👨‍🍳 Produção (pedidos e receitas)</a>
      <a class="grande" href="/cliente.html">📱 Pedido do cliente</a>
      <a class="grande" href="/compras/">🛒 Lista de compras</a>
      <a class="grande" href="/gestao.html">📊 Gestão</a>
    </nav>
  </main>
  <script>
    fetch("/api/saude")
      .then(r => r.json())
      .then(d => {
        const el = document.getElementById("status");
        el.textContent = `Servidor no ar · versão ${d.versao} · banco: ${d.banco}`;
        el.classList.add("ok");
      })
      .catch(() => {
        const el = document.getElementById("status");
        el.textContent = "Servidor fora do ar";
        el.classList.add("erro");
      });
  </script>
</body>
</html>

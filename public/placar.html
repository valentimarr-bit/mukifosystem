<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05010f"><link rel="icon" href="/icone.svg">
<title>Mukifo · Placar da sinuca</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}
:root{--neon:#39ff14;--rosa:#ff2bd6;--cian:#19e3ff;--ouro:#ffd23f;--prata:#d6dbe6;--bronze:#e08a3c;--fundo:#05010f}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#2a0b4d 0,var(--fundo) 60%) fixed;color:#e9e4ff;font:700 16px "Courier New",ui-monospace,monospace;letter-spacing:.04em;min-height:100vh;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
main{max-width:860px;margin:0 auto;padding:14px 12px 90px}
h1{margin:6px 0 2px;text-align:center;font-size:clamp(20px,5.5vw,38px);color:var(--rosa);text-shadow:0 0 6px var(--rosa),0 0 18px #ff2bd699,3px 3px 0 #4a0a63;letter-spacing:.12em}
.sub{text-align:center;color:var(--cian);text-shadow:0 0 8px #19e3ff88;font-size:clamp(12px,3.2vw,18px)}
.pisca{animation:pisca 1.1s steps(2,jump-none) infinite}@keyframes pisca{50%{opacity:.15}}
.abas{display:flex;gap:6px;margin:14px 0 6px;flex-wrap:wrap;justify-content:center}
.abas button{font:inherit;font-size:14px;color:var(--cian);background:#0d0524;border:2px solid #19e3ff77;border-radius:6px;padding:0 12px;min-height:44px;cursor:pointer;letter-spacing:.08em}
.abas button[aria-pressed=true]{color:#05010f;background:var(--cian);box-shadow:0 0 14px var(--cian)}
.abas.ord button{color:var(--neon);border-color:#39ff1477}.abas.ord button[aria-pressed=true]{color:#05010f;background:var(--neon);box-shadow:0 0 14px var(--neon)}
.rot{text-align:center;font-size:12px;color:#9a8fc4;margin:2px 0}
.tabela{margin-top:10px;border:2px solid #ff2bd666;border-radius:10px;background:#0a0420cc;box-shadow:0 0 24px #ff2bd622 inset,0 0 24px #ff2bd633;overflow:hidden}
.th,.lin{display:grid;grid-template-columns:52px 1fr 54px 54px 56px 64px;gap:4px;align-items:center;padding:10px 12px}
.th{color:var(--ouro);font-size:12px;border-bottom:2px dashed #ffd23f55;text-shadow:0 0 8px #ffd23f88}
.lin{border-top:1px solid #ffffff12;font-size:clamp(15px,4vw,20px)}.lin:first-of-type{border-top:0}
.lin .r{color:var(--cian)}.lin .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lin .n small{display:block;font-size:11px;color:#9a8fc4;font-weight:400}
.lin .num,.th .num{text-align:right}.lin .sc{color:var(--neon);text-shadow:0 0 8px #39ff1488}
.lin.p1{color:var(--ouro);text-shadow:0 0 10px #ffd23faa;background:linear-gradient(90deg,#ffd23f1c,transparent)}.lin.p1 .r{color:var(--ouro)}
.lin.p2{color:var(--prata);text-shadow:0 0 8px #d6dbe688}.lin.p2 .r{color:var(--prata)}
.lin.p3{color:var(--bronze);text-shadow:0 0 8px #e08a3c88}.lin.p3 .r{color:var(--bronze)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0;box-shadow:0 0 8px currentColor}
.fogo{color:#ff7a1a;text-shadow:0 0 8px #ff7a1a}
.vazio{padding:36px 12px;text-align:center;color:#9a8fc4}
.rodape{position:fixed;left:0;right:0;bottom:0;text-align:center;padding:14px;background:linear-gradient(0deg,#05010f,#05010fcc 70%,transparent);z-index:5}
.rodape a{color:var(--ouro);text-decoration:none;font-size:clamp(14px,4vw,20px);text-shadow:0 0 10px #ffd23f99}
.tot{display:flex;justify-content:center;gap:22px;margin:10px 0 0;color:#cfc6ff;font-size:13px;flex-wrap:wrap}.tot b{color:var(--ouro)}
body.tv{font-size:22px}body.tv main{max-width:1500px}body.tv .abas.ord{display:none}body.tv .th,body.tv .lin{grid-template-columns:90px 1fr 120px 120px 120px 140px;padding:14px 22px}
body.tv .lin{font-size:clamp(22px,2.6vw,40px)}body.tv .th{font-size:20px}body.tv h1{font-size:clamp(34px,5vw,72px)}
@media (max-width:440px){.th,.lin{grid-template-columns:36px 1fr 38px 38px 42px 54px;padding:9px 8px;gap:2px}.th{font-size:10px}.lin{font-size:14px}}
</style></head><body>
<main>
  <h1><span class="pisca">★</span> HALL DA FAMA <span class="pisca">★</span></h1>
  <div class="sub">SINUCA MUKIFO · QUEM MANDA NA MESA</div>
  <div class="abas" id="abasPer" role="group" aria-label="Período"></div>
  <div class="abas ord" id="abasOrd" role="group" aria-label="Ordenar por"></div>
  <div class="tot" id="tot"></div>
  <div class="tabela" id="tab"><div class="vazio pisca">CARREGANDO…</div></div>
  <div class="rot" id="rot"></div>
</main>
<div class="rodape"><a href="/sinuca.html" class="pisca">▶ INSERT COIN · ENTRE NA FILA ◀</a></div>
<script>
const $ = (s) => document.querySelector(s), esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const Q = new URLSearchParams(location.search), TV = Q.get('tv') === '1';
if (TV) document.body.classList.add('tv');
const PER = [['hoje', 'HOJE'], ['semana', '7 DIAS'], ['mes', 'MÊS'], ['sempre', 'SEMPRE']], ORD = [['score', 'SCORE'], ['vitorias', 'VITÓRIAS'], ['jogos', 'JOGOS'], ['sequencia', 'SEQUÊNCIA']];
let per = PER.some((p) => p[0] === Q.get('periodo')) ? Q.get('periodo') : (TV ? 'hoje' : 'sempre'), ord = ORD.some((o) => o[0] === Q.get('ordem')) ? Q.get('ordem') : 'score', dados = null;
const botoes = (lista, atual, tipo) => lista.map(([k, t]) => `<button type="button" data-${tipo}="${k}" aria-pressed="${k === atual}">${t}</button>`).join('');
const ORDINAL = (n) => n === 1 ? '1ST' : n === 2 ? '2ND' : n === 3 ? '3RD' : n + 'TH';
function desenhar() {
  $('#abasPer').innerHTML = botoes(PER, per, 'per'); $('#abasOrd').innerHTML = botoes(ORD, ord, 'ord');
  const d = dados; if (!d) return;
  $('#tot').innerHTML = `<span><b>${d.totais.jogos}</b> JOGOS</span><span><b>${d.totais.jogadores}</b> JOGADORES</span>`;
  $('#rot').textContent = ord === 'score' && per !== 'sempre' ? 'Score = pontuação geral de cada jogador; jogos e vitórias são do período.' : '';
  if (!d.jogadores.length) { $('#tab').innerHTML = '<div class="vazio">NINGUÉM JOGOU NESTE PERÍODO.<br><span class="pisca" style="color:#ffd23f">INSERT COIN</span></div>'; return; }
  $('#tab').innerHTML = `<div class="th"><span>#</span><span>JOGADOR</span><span class="num">JOGOS</span><span class="num">VIT</span><span class="num">%</span><span class="num">SCORE</span></div>` +
    d.jogadores.map((j) => `<div class="lin ${j.posicao <= 3 ? 'p' + j.posicao : ''}"><span class="r">${ORDINAL(j.posicao)}</span><span class="n"><i class="dot" style="color:${esc(j.cor)};background:${esc(j.cor)}"></i>${esc(j.nome)}<small>${esc(j.nivel)}${j.sequencia >= 2 ? ` · <span class="fogo">🔥 ${j.sequencia} seguidas</span>` : ''}${j.melhor_sequencia >= 3 ? ` · recorde ${j.melhor_sequencia}` : ''}</small></span><span class="num">${j.jogos}</span><span class="num">${j.vitorias}</span><span class="num">${j.aproveitamento}</span><span class="num sc">${j.score}</span></div>`).join('');
}
async function carregar() {
  try { const r = await fetch(`/api/sinuca/placar?periodo=${per}&ordem=${ord}`); if (!r.ok) throw 0; dados = await r.json(); desenhar(); }
  catch { if (!dados) $('#tab').innerHTML = '<div class="vazio">SEM SINAL. TENTANDO DE NOVO…</div>'; }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-per],[data-ord]'); if (!b) return;
  if (b.dataset.per) per = b.dataset.per; else ord = b.dataset.ord; carregar();
});
setInterval(() => { if (!document.hidden) carregar(); }, 15000);
if (TV) setInterval(() => { per = PER[(PER.findIndex((p) => p[0] === per) + 1) % PER.length][0]; carregar(); }, 20000);   // na TV, passa de período sozinho
desenhar(); carregar();
</script></body></html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Início · Mukifo</title>
  <script src="/tema.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; background: var(--bg); color: var(--txt);
      font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { font-size: 30px; margin: 8px 0 4px; }
    .cargo { color: var(--mut); margin: 0 0 20px; font-size: 18px; }
    .aviso { padding: 14px 16px; border-radius: 12px; background: var(--aviso-bg); color: var(--aviso-txt); font-size: 18px; margin-bottom: 16px; }
    .vazio { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--mut); font-size: 18px; }
    .botoes { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 600px) { .botoes { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 900px) { .botoes { grid-template-columns: repeat(3, 1fr); } }
    .botao {
      display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 14px 18px;
      border-radius: 16px; background: var(--card); color: var(--txt); border: 1px solid var(--line);
      font-size: 22px; font-weight: 600; text-decoration: none;
    }
    .botao:active { transform: scale(.97); }
    .botao .emoji { font-size: 36px; line-height: 1; flex: none; }
  </style>
</head>
<body>
  <main>
    <h1 id="ola">Carregando…</h1>
    <p class="cargo" id="cargo"></p>
    <div id="aviso" class="aviso" hidden></div>
    <div id="vazio" class="vazio" hidden>Peça ao dono para liberar suas telas.</div>
    <nav class="botoes" id="botoes" aria-label="Telas"></nav>
  </main>
  <script src="/entrar.js"></script>
  <script src="/menu.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      if (params.get('sem') === '1') {
        const aviso = document.getElementById('aviso');
        aviso.textContent = 'Seu login não abre aquela tela. Peça ao dono.';
        aviso.hidden = false;
      }
      let u;
      try {
        u = await Menu.eu();
      } catch (e) {
        document.getElementById('ola').textContent = 'Não deu para abrir';
        const aviso = document.getElementById('aviso');
        aviso.textContent = e.message;
        aviso.hidden = false;
        return;
      }
      if (!u) return; // sem login: o Menu já mandou para a tela Entrar
      document.getElementById('ola').textContent = 'Olá, ' + (u.nome || '');
      const cargo = Menu.cargoDe(u);
      document.getElementById('cargo').textContent = cargo ? 'Seu cargo: ' + cargo : '';
      const lista = Menu.permitidos(u);
      const botoes = document.getElementById('botoes');
      if (!lista.length) {
        document.getElementById('vazio').hidden = false;
      }
      for (const it of lista) {
        const a = document.createElement('a');
        a.className = 'botao';
        a.href = it.href;
        const em = document.createElement('span'); em.className = 'emoji'; em.textContent = it.emoji;
        const tx = document.createElement('span'); tx.textContent = it.rotulo.replace(/^\S+\s/, '');
        a.append(em, tx);
        botoes.append(a);
      }
      Menu.barra();
    })();
  </script>
</body>
</html>

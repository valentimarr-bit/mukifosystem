<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000">
<title>Mukifo · Venda</title><script src="/tema.js"></script>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:17px system-ui,sans-serif}
header{background:var(--hdr);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0;flex:1}header a,header select{color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;font-size:15px}
.abas{display:flex;gap:8px;padding:10px 14px}.abas button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:17px;font-weight:600}
.abas button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:12px;padding:0 14px 24px}main>*{min-width:0}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr);padding-bottom:12px}.painel{position:sticky!important;bottom:0;top:auto!important;max-height:46vh;overflow:auto;box-shadow:0 -6px 16px #0008;z-index:4}}
img,video{max-width:100%}dialog{max-width:94vw;max-height:92vh;overflow:auto}header h1{min-width:0;white-space:nowrap;flex:1 1 auto}#resumo{order:5;flex:1 1 100%;font-size:13px}@media(min-width:700px){#resumo{order:0;flex:0 1 auto;font-size:14px}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.chips button{white-space:nowrap;min-height:48px;padding:0 16px;border-radius:24px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px}
.chips button.on{background:var(--acc);color:var(--on-acc);font-weight:700}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px}
.prod{min-height:104px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-size:16px;cursor:pointer}
.prod.fim{opacity:.4;cursor:not-allowed}.prod small{color:var(--warn);font-size:13px}.prod.fim small{color:var(--bad);font-weight:700}.prod:active{transform:scale(.97)}.prod b{font-size:22px;color:var(--acc)}.prod span{line-height:1.2}
.painel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;align-self:start;position:sticky;top:70px}
.cmd{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.cmd button{white-space:nowrap;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--txt)}.cmd button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.lin{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.lin .n{flex:1}.lin button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--txt);font-size:24px}
.total{font-size:30px;font-weight:800;text-align:right;margin:10px 0}.grande{width:100%;min-height:60px;border-radius:14px;border:0;font-size:20px;font-weight:700;background:var(--acc);color:var(--on-acc);cursor:pointer;margin-top:8px}
.grande.sec{background:var(--input);color:var(--txt);border:1px solid var(--line);font-size:16px;min-height:48px;font-weight:500}.grande.ok{background:var(--ok);color:var(--on-ok)}
.mut{color:var(--mut);font-size:14px}.ruim{color:var(--bad)}.bom{color:var(--ok)}
dialog{border:none;border-radius:16px;background:var(--card);color:var(--txt);width:min(94vw,440px);padding:18px}dialog::backdrop{background:#000b}
.formas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.formas button{min-height:72px;border-radius:14px;border:2px solid var(--line);background:var(--input);color:var(--txt);font-size:19px;font-weight:600}.formas button.on{border-color:var(--acc);background:var(--acc);color:var(--on-acc)}
input,select.f{width:100%;min-height:50px;font-size:18px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--txt)}
.cob{padding:10px;border:1px dashed var(--acc);border-radius:12px;margin:8px 0}#msg{position:fixed;left:12px;right:12px;bottom:12px;background:var(--hdr);border:1px solid var(--line);padding:14px;border-radius:12px;z-index:20;display:none;font-size:17px}
.ret{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
.setor{min-height:112px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:20px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:10px;text-align:center}.setor span{font-size:44px;line-height:1}.setor small{font-size:14px;font-weight:400;color:var(--mut)}.setor:active{transform:scale(.97)}.busca{display:block;width:100%;min-height:54px;font-size:18px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--input);color:var(--txt);margin:0 0 10px}.volta{min-height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-weight:800;font-size:17px;cursor:pointer}.cabset{display:flex;align-items:center;gap:12px;margin-bottom:10px}.cabset b{font-size:20px}
.chips{display:none!important}
button,.setor,.prod{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style></head><body>
<header><h1>🍸 Venda</h1><span class="mut" id="resumo"></span><select id="tema" data-seletor-tema></select><a href="/gestao.html">Gestão</a></header>
<div class="abas"><button id="aV" class="on">Vender</button><button id="aR">Retirada do app <span id="nRet"></span></button><button id="aH">Histórico</button></div>

<main id="telaV">
  <section><input class="busca" id="busca" type="search" placeholder="🔎 Buscar produto" autocomplete="off"><div class="cabset" id="cabset" hidden></div><div class="grade" id="grade"></div></section>
  <aside class="painel"><div class="cmd" id="cmd"></div><div id="itens"></div>
    <div class="total" id="total">R$ 0,00</div><div id="cobsPend"></div>
    <button class="grande" id="bCobrar">Cobrar</button>
    <button class="grande sec" id="bCancelar">Descartar pedido</button></aside>
</main>

<main id="telaH" hidden style="grid-template-columns:1fr;padding:0 14px 90px;max-width:760px;margin:0 auto">
  <div style="display:flex;gap:8px;align-items:center;margin:8px 0"><input id="hDia" type="date" class="f" style="flex:1"><button class="sec" id="hHoje" style="min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt)">Hoje</button></div>
  <div id="hResumo" class="mut" style="margin:4px 0 10px"></div><div id="hLista"></div>
</main>
<main id="telaR" hidden style="grid-template-columns:1fr">
  <section><div class="painel" style="position:static"><b>Conferir QR do cliente</b>
    <video id="cam" playsinline style="width:100%;border-radius:12px;margin:8px 0;display:none"></video>
    <button class="grande" id="bCam">📷 Abrir câmera e ler QR</button>
    <p class="mut">Ou cole/digite o código do QR:</p><input id="codigo" placeholder="MKF1...." autocomplete="off">
    <button class="grande sec" id="bConferir">Conferir código</button><div id="confRes"></div></div>
    <h3>Pix do app esperando conferência</h3><p class="mut">Só toque em “Pix recebido” depois de ver o dinheiro na conta do banco.</p><div id="listaAg"></div>
    <h3>Pedidos do app pagos, esperando retirada</h3><div id="listaRet"></div></section>
</main>

<dialog id="dCobrar"><h3 style="margin:0">Cobrar <span id="dValor"></span></h3>
  <div class="formas" id="formas"><button data-f="pix">Pix</button><button data-f="debito">Débito</button><button data-f="credito">Crédito</button><button data-f="dinheiro">Dinheiro</button></div>
  <div id="boxMaq"><label class="mut">Maquininha</label><select class="f" id="maq"></select></div>
  <label class="mut">Valor desta cobrança (para dividir a conta, diminua)</label><input id="valor" inputmode="decimal">
  <div id="boxDin" hidden>
    <label class="mut">Valor recebido do cliente</label><input id="recebido" inputmode="decimal" placeholder="quanto o cliente deu">
    <div class="formas" id="notas" style="margin-top:8px"></div>
    <div id="troco" style="font-size:1.4em;font-weight:700;margin:10px 0;text-align:center"></div>
  </div>
  <div class="mut ruim" id="dErro"></div><button class="grande" id="dOk">Cobrar</button><button class="grande sec" id="dFecha">Voltar</button></dialog>
<div id="msg"></div>
<script src="/entrar.js"></script>
<script>
Tema.ligarSeletor(document.getElementById('tema'));
const $ = (s) => document.querySelector(s), R$ = (v) => 'R$ ' + Number(v).toFixed(2).replace('.', ',');
let token = Mukifo.token(), cardapio = [], cat = -1, busca = '', comandas = [], atual = null, maqs = [], forma = null;
const msg = (t, ruim) => { const m = $('#msg'); m.textContent = t; m.style.color = ruim ? 'var(--bad)' : 'var(--txt)'; m.style.display = 'block'; clearTimeout(msg.t); msg.t = setTimeout(() => m.style.display = 'none', 5000); };
async function api(url, metodo = 'GET', corpo) {
  const r = await fetch(url, { method: metodo, body: corpo ? JSON.stringify(corpo) : undefined, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token } });
  const j = await r.json().catch(() => ({})); if (r.status === 401) { Mukifo.pedir(() => { token = Mukifo.token(); iniciar(); }); throw new Error(j.erro); }
  if (!r.ok) throw new Error(j.erro || 'Erro ' + r.status); return j;
}
const tentar = (f) => async (...a) => { try { await f(...a); } catch (e) { msg(e.message, true); recarregarCardapio(); } };
async function recarregarCardapio() { try { cardapio = (await (await fetch('/api/venda/cardapio', { cache: 'no-store' })).json()).categorias; if (cat >= cardapio.length) cat = -1; desenharCardapio(); } catch {} }

const EMOJI = { 'Promoções e kits': '🎉', Drinks: '🍹', Doses: '🥃', 'Cervejas e long necks': '🍺', Energéticos: '⚡', 'Refrigerantes e águas': '🥤', Porções: '🍟', 'Pratos e lanches': '🍔' };
const sem = (t) => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const prodBtn = (p) => `<button class="prod${p.restam === 0 ? ' fim' : ''}" data-id="${p.id}"${p.restam === 0 ? ' disabled' : ''}><span>${p.nome}${p.restam === 0 ? '<br><small>ESGOTADO</small>' : p.restam != null && p.restam <= 5 ? `<br><small>restam ${p.restam}</small>` : ''}</span><b>${R$(p.preco)}</b></button>`;
function desenharCardapio() {
  const q = sem(busca.trim()), cab = $('#cabset');
  if (q) { cab.hidden = true; $('#grade').innerHTML = cardapio.flatMap((c) => c.produtos.map((p) => ({ ...p, _s: c.nome }))).filter((p) => sem(p.nome).includes(q) || sem(p._s).includes(q)).map(prodBtn).join('') || '<p class="mut">Nenhum produto com esse nome.</p>';
  } else if (cat >= 0 && cardapio[cat]) { cab.hidden = false; cab.innerHTML = `<button class="volta" id="bSetores">← Setores</button><b>${EMOJI[cardapio[cat].nome] ?? '🍽️'} ${cardapio[cat].nome}</b>`; $('#grade').innerHTML = cardapio[cat].produtos.map(prodBtn).join('');
  } else { cat = -1; cab.hidden = true; $('#grade').innerHTML = cardapio.map((c, i) => `<button class="setor" data-i="${i}"><span>${EMOJI[c.nome] ?? '🍽️'}</span>${c.nome}<small>${c.produtos.length} ${c.produtos.length === 1 ? 'item' : 'itens'}</small></button>`).join(''); }
}
function desenharComanda() {
  $('#cmd').innerHTML = comandas.map((c) => `<button data-id="${c.id}" class="${atual?.id === c.id ? 'on' : ''}">Pedido ${c.numero}${c.mesa ? ' · ' + c.mesa : ''}</button>`).join('') + '<button id="nova">+ Outro pedido</button>';
  const c = atual;
  $('#itens').innerHTML = !c ? '<p class="mut">Toque nos produtos: cada toque coloca 1 no pedido.</p>' : (c.itens.length ? c.itens.map((i) =>
    `<div class="lin"><span class="n">${i.nome}<br><span class="mut">${R$(i.preco)}</span></span><button data-p="${i.produto_id}" data-d="-1">−</button><b>${i.quantidade}</b><button data-p="${i.produto_id}" data-d="1">+</button></div>`).join('') : '<p class="mut">Pedido vazio. Toque nos produtos.</p>');
  $('#total').textContent = R$(c?.total ?? 0);
  $('#cobsPend').innerHTML = (c?.cobrancas ?? []).filter((x) => x.status === 'pendente').map((x) =>
    `<div class="cob"><b>${R$(x.valor)}</b> · ${x.forma}${x.maquininha ? ' na <b>' + x.maquininha + '</b>' : ''}<br>
     <button class="grande ok" data-conf="${x.id}">Recebido ✓</button><button class="grande sec" data-canc="${x.id}">Cancelar cobrança</button></div>`).join('')
    + (c && c.pago ? `<p class="bom">Já pago: ${R$(c.pago)}</p>` : '');
  $('#bCobrar').disabled = !c || c.restante <= 0; $('#bCancelar').style.display = c && !c.pago ? '' : 'none';
}
const lerComandas = async () => { comandas = (await api('/api/venda/comandas')).comandas; if (atual && !comandas.find((c) => c.id === atual.id)) atual = null; if (!atual && comandas[0]) atual = (await api('/api/venda/comandas/' + comandas[0].id)).comanda; desenharComanda(); };
const atualizarResumo = async () => { try { const r = await api('/api/venda/resumo'); $('#resumo').textContent = `Hoje: ${r.vendas} vendas · ${R$(r.total)}`; } catch {} };
async function abrir(id) { atual = (await api('/api/venda/comandas/' + id)).comanda; desenharComanda(); }
function depois(r) { recarregarCardapio(); if (r.comanda) { atual = r.comanda; if (['entregue', 'recebido', 'cancelado'].includes(atual.status)) { msg('Venda fechada ✓ ' + R$(atual.total)); atual = null; } } lerComandas(); atualizarResumo(); }

$('#cabset').onclick = (e) => { if (e.target.closest('#bSetores')) { cat = -1; desenharCardapio(); } };
$('#busca').oninput = (e) => { busca = e.target.value; desenharCardapio(); };
// ---- toque instantâneo: o item aparece na hora e o servidor confirma por trás (1 chamada, sem recarregar o resto) ----
let fila = Promise.resolve(), emVoo = 0; const pend = new Map(); let agenda = null;
const nomeDe = (id) => { for (const c of cardapio) { const p = c.produtos.find((x) => x.id === id); if (p) return p; } return null; };
function tocar(id, delta, dadosProd) {
  const p = dadosProd ?? nomeDe(id); if (!p && delta > 0) return;
  if (!atual) atual = { id: null, numero: '…', mesa: '', itens: [], cobrancas: [], total: 0, pago: 0, pendente: 0, restante: 0, status: 'aberta', provisoria: true };
  const l = atual.itens.find((i) => i.produto_id === id);
  if (l) { l.quantidade += delta; if (l.quantidade <= 0) atual.itens = atual.itens.filter((i) => i !== l); }
  else if (delta > 0) atual.itens.push({ id: 'tmp' + id, produto_id: id, nome: p.nome, quantidade: delta, preco: p.preco });
  atual.total = Math.round(atual.itens.reduce((t, i) => t + i.quantidade * i.preco, 0) * 100) / 100; atual.restante = Math.max(0, atual.total - atual.pago - atual.pendente);
  desenharComanda();
  pend.set(id, (pend.get(id) ?? 0) + delta); clearTimeout(agenda); agenda = setTimeout(enviarPend, 120);   // toques seguidos viram uma chamada só
}
function enviarPend() {
  if (!pend.size) return fila; const lote = [...pend]; pend.clear(); emVoo++;
  fila = fila.then(async () => {
    try {
      if (!atual.id) { const r = await api('/api/venda/comandas', 'POST', { mesa: '' }); atual = { ...atual, id: r.comanda.id, numero: r.comanda.numero, provisoria: false }; comandas.push({ id: r.comanda.id, numero: r.comanda.numero, mesa: '' }); }
      let ultima = null; for (const [id, d] of lote) if (d !== 0) ultima = (await api(`/api/venda/comandas/${atual.id}/itens`, 'POST', { produto_id: id, delta: d })).comanda;
      if (ultima && emVoo === 1 && !pend.size) { atual = ultima; if (['entregue', 'recebido', 'cancelado'].includes(atual.status)) atual = null; desenharComanda(); }   // só confia no servidor quando não há toque novo esperando
    } catch (e) { pend.clear(); msg(e.message, true); atual = null; await lerComandas().catch(() => {}); recarregarCardapio(); }
    finally { emVoo--; }
  });
  return fila;
}
const esvaziar = async () => { clearTimeout(agenda); await enviarPend(); await fila; };
$('#grade').onclick = (e) => { const st = e.target.closest('.setor'); if (st) { cat = +st.dataset.i; desenharCardapio(); return; } const b = e.target.closest('.prod'); if (!b || b.disabled) return;
  b.style.outline = '3px solid var(--acc)'; setTimeout(() => (b.style.outline = ''), 160); if (navigator.vibrate) navigator.vibrate(15); tocar(+b.dataset.id, 1); };
async function novaComanda() { await esvaziar(); const r = await api('/api/venda/comandas', 'POST', { mesa: '' }); atual = r.comanda; comandas.push({ id: r.comanda.id, numero: r.comanda.numero, mesa: '' }); desenharComanda(); }
$('#cmd').onclick = tentar(async (e) => { const b = e.target.closest('button'); if (!b) return; if (b.id === 'nova') return novaComanda(); await abrir(b.dataset.id); });
$('#itens').onclick = (e) => { const b = e.target.closest('button[data-p]'); if (b) tocar(+b.dataset.p, +b.dataset.d); };
$('#cobsPend').onclick = tentar(async (e) => { const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.conf) depois(await api(`/api/venda/cobrancas/${b.dataset.conf}/confirmar`, 'POST', {}));
  if (b.dataset.canc) depois(await api(`/api/venda/cobrancas/${b.dataset.canc}/cancelar`, 'POST', {})); });
$('#bCancelar').onclick = tentar(async () => { await esvaziar(); if (confirm('Descartar este pedido?')) { await api(`/api/venda/comandas/${atual.id}/cancelar`, 'POST', {}); atual = null; await lerComandas(); } });

$('#bCobrar').onclick = async () => { await esvaziar(); if (!atual?.id) return; forma = null; $('#dErro').textContent = ''; $('#dValor').textContent = R$(atual.restante); $('#valor').value = String(atual.restante).replace('.', ',');
  document.querySelectorAll('#formas button').forEach((b) => b.classList.remove('on')); $('#boxMaq').hidden = true; $('#boxDin').hidden = true;
  $('#maq').innerHTML = '<option value="">Automática (padrão)</option>' + maqs.filter((m) => m.ativa).map((m) => `<option value="${m.id}">${m.nome}</option>`).join(''); $('#dCobrar').showModal(); };
$('#formas').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; forma = b.dataset.f; document.querySelectorAll('#formas button').forEach((x) => x.classList.toggle('on', x === b)); $('#boxMaq').hidden = forma === 'dinheiro'; $('#boxDin').hidden = forma !== 'dinheiro'; if (forma === 'dinheiro') { $('#recebido').value = ''; calcTroco(); } };
const num = (v) => parseFloat(String(v).replace(',', '.'));
function calcTroco() {   // troco = recebido − valor cobrado (só na tela; o sistema registra o valor cobrado)
  const dev = num($('#valor').value), rec = num($('#recebido').value), t = $('#troco');
  const notas = [...new Set([dev, 10, 20, 50, 100, 200].filter((n) => Number.isFinite(n) && n >= dev - 0.005))].sort((a, b) => a - b).slice(0, 6);
  $('#notas').innerHTML = notas.map((n) => `<button type="button" data-n="${n}">${n === dev ? 'Exato ' : ''}${R$(n)}</button>`).join('');
  if (!Number.isFinite(rec)) { t.textContent = ''; return; }
  const dif = Math.round((rec - dev) * 100) / 100;
  t.style.color = dif < 0 ? 'var(--bad)' : 'var(--ok, #4ade80)';
  t.textContent = dif < 0 ? `Falta ${R$(-dif)}` : dif === 0 ? 'Sem troco' : `Troco: ${R$(dif)}`;
}
$('#recebido').oninput = $('#valor').oninput = calcTroco;
$('#notas').onclick = (e) => { const b = e.target.closest('button[data-n]'); if (b) { $('#recebido').value = String(b.dataset.n).replace('.', ','); calcTroco(); } };
$('#dFecha').onclick = () => $('#dCobrar').close();
$('#dOk').onclick = async () => { try { if (!forma) throw new Error('Escolha a forma de pagamento.');
  let troco = 0;
  if (forma === 'dinheiro') { const dev = num($('#valor').value), rec = num($('#recebido').value);
    if (Number.isFinite(rec) && rec < dev - 0.005) throw new Error(`O cliente deu menos do que ${R$(dev)}.`);
    if (Number.isFinite(rec)) troco = Math.round((rec - dev) * 100) / 100; }
  const r = await api(`/api/venda/comandas/${atual.id}/cobrar`, 'POST', { forma, valor: parseFloat(String($('#valor').value).replace(',', '.')), maquininha_id: $('#maq').value ? +$('#maq').value : undefined });
  $('#dCobrar').close(); if (r.maquininha) msg(`Passe ${R$(r.comanda.pendente)} na ${r.maquininha}, depois toque em “Recebido ✓”.`); depois(r);
  if (troco > 0) { msg(`💵 Devolva de troco: ${R$(troco)}`); clearTimeout(msg.t); msg.t = setTimeout(() => ($('#msg').style.display = 'none'), 15000); } } catch (e) { $('#dErro').textContent = e.message; } };

// ---- retirada do app ----
const abas = (qual) => { if (qual !== 'R' && typeof fecharCamera === 'function') fecharCamera(); $('#telaV').hidden = qual !== 'V'; $('#telaR').hidden = qual !== 'R'; $('#telaH').hidden = qual !== 'H'; for (const k of 'VRH') $('#a' + k).classList.toggle('on', k === qual); };
const ROTULO = { entregue: 'Entregue', recebido: 'Pago · na fila', preparando: 'Preparando', pronto: 'Pronto', cancelado: 'Cancelado', aguardando_pagamento: 'Aguardando pagamento' };
const FORMA = { pix: 'Pix', debito: 'Débito', credito: 'Crédito', dinheiro: 'Dinheiro' };
const minEnt = (a, b) => { const d = (Date.parse(String(b).replace(' ', 'T') + 'Z') - Date.parse(String(a).replace(' ', 'T') + 'Z')) / 60000; return a && b && d >= 0 ? Math.round(d * 10) / 10 : null; };
function etapasTxt(p) {   // tempo de cada etapa, registrado pedido a pedido
  const t = [['pagou em', minEnt(p.criado_em, p.pago_em)], ['fila', minEnt(p.pago_em, p.preparo_em)], ['preparo', minEnt(p.preparo_em, p.pronto_em)], ['retirada', p.origem === 'celular' ? minEnt(p.pronto_em, p.retirado_em) : null]].filter(([, v]) => v != null);
  return t.length ? `<div class="mut" style="margin-top:4px">⏱ ${t.map(([k, v]) => `${k} ${String(v).replace('.', ',')} min`).join(' · ')}</div>` : '';
}
async function lerHistorico() {
  const r = await api('/api/venda/historico' + ($('#hDia').value ? '?dia=' + $('#hDia').value : '')); $('#hDia').value = r.dia;   // sem data: o servidor usa o dia do turno
  const validos = r.pedidos.filter((p) => p.status !== 'cancelado'), soma = validos.reduce((s, p) => s + p.total, 0);
  $('#hResumo').textContent = `${validos.length} pedido(s) · ${R$(soma)}` + (r.pedidos.length > validos.length ? ` · ${r.pedidos.length - validos.length} cancelado(s)` : '');
  $('#hLista').innerHTML = r.pedidos.length ? r.pedidos.map((p) => `<div class="ret" style="margin-bottom:8px${p.status === 'cancelado' ? ';opacity:.55' : ''}"><div style="display:flex;justify-content:space-between;gap:8px"><b>#${p.numero} ${p.origem === 'celular' ? '📱' : '🍸'} ${p.nome_cliente ?? ''}</b><b>${R$(p.total)}</b></div>
    <div class="mut">${new Date(String(p.criado_em).replace(' ', 'T') + 'Z').toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' })} · ${ROTULO[p.status] ?? p.status}${p.pagamentos.length ? ' · ' + p.pagamentos.map((c) => `${FORMA[c.forma] ?? c.forma} ${R$(c.valor)}`).join(' + ') : ''}</div>
    <div>${p.itens.map((i) => `${i.quantidade}× ${i.nome}`).join(', ')}</div>${etapasTxt(p)}</div>`).join('') : '<p class="mut">Nenhum pedido neste dia.</p>';
}
$('#aH').onclick = () => { abas('H'); lerHistorico().catch((e) => msg(e.message, true)); };
$('#hDia').onchange = () => lerHistorico().catch((e) => msg(e.message, true));
$('#hHoje').onclick = () => { $('#hDia').value = ''; lerHistorico().catch((e) => msg(e.message, true)); };
$('#aV').onclick = () => abas('V');
$('#aR').onclick = () => { abas('R'); lerRetiradas(); setTimeout(() => $('#codigo').focus(), 50); };
$('#listaAg').onclick = tentar(async (e) => { const b = e.target.closest('[data-cob]'); if (b) { await api(`/api/venda/cobrancas/${b.dataset.cob}/confirmar`, 'POST', {}); lerRetiradas(); atualizarResumo(); } });
async function lerRetiradas() { const r = await api('/api/venda/retiradas'); $('#nRet').textContent = r.pedidos.length ? `(${r.pedidos.length})` : '';
  $('#listaAg').innerHTML = r.aguardando.map((p) => `<div class="ret"><b>#${p.numero}</b> ${p.nome_cliente ?? ''} · ${R$(p.total)}<button class="grande ok" data-cob="${p.cobranca_id}">Pix recebido ✓</button></div>`).join('') || '<p class="mut">Nenhum.</p>';
  $('#listaRet').innerHTML = r.pedidos.map((p) => `<div class="ret"><b>#${p.numero}</b> ${p.nome_cliente ?? ''} · ${R$(p.total)} <span class="bom">pago</span></div>`).join('') || '<p class="mut">Nenhum pedido esperando.</p>'; }
async function conferir(codigo, confirmar) { return api('/api/venda/retirada', 'POST', { codigo, confirmar }); }
function mostrar(r, codigo) { const p = r.pedido; $('#confRes').innerHTML = `<div class="ret"><b class="bom">✔ Pago e válido</b><br><b>#${p.numero}</b> ${p.nome ?? ''} · ${R$(p.total)}<ul>${p.itens.map((i) => `<li>${i.quantidade}× ${i.nome}</li>`).join('')}</ul>` +
  (r.entregue ? '<b class="bom">Entregue ✓ — saiu da produção</b>' : `<button class="grande ok" id="bEntregar">Entregar ✓</button>`) + '</div>';
  const b = $('#bEntregar'); if (b) b.onclick = tentar(async () => { mostrar(await conferir(codigo, true), codigo); lerRetiradas(); atualizarResumo(); }); }
// QR lido pela câmera ou leitor: confere E já dá a baixa (entrega) — o QR é de uso único, então não precisa de segundo toque
const baixar = tentar(async (codigo) => { $('#confRes').innerHTML = ''; try { mostrar(await conferir(codigo, true), codigo); lerRetiradas(); atualizarResumo(); navigator.vibrate?.([80, 60, 80]); } catch (e) { $('#confRes').innerHTML = `<div class="ret ruim"><b>✖ ${e.message}</b></div>`; navigator.vibrate?.(400); } });
const checar = tentar(async (codigo) => { $('#confRes').innerHTML = ''; try { mostrar(await conferir(codigo, false), codigo); } catch (e) { $('#confRes').innerHTML = `<div class="ret ruim"><b>✖ ${e.message}</b></div>`; } });
$('#bConferir').onclick = () => checar($('#codigo').value.trim());
let stream = null;
let carregouJsQR = null;
const carregarJsQR = () => carregouJsQR ??= new Promise((ok, no) => { if (window.jsQR) return ok(); const t = document.createElement('script'); t.src = '/vendor/jsqr.min.js'; t.onload = ok; t.onerror = () => no(new Error('Não consegui carregar o leitor de QR.')); document.head.appendChild(t); });
function fecharCamera() { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; $('#cam').style.display = 'none'; $('#bCam').textContent = '📷 Abrir câmera e ler QR'; }
$('#bCam').onclick = tentar(async () => {
  if (stream) return fecharCamera();   // segundo toque fecha
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('A câmera só abre em endereço seguro (https). Use o código digitado.');
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); const v = $('#cam'); v.srcObject = stream; v.style.display = 'block'; await v.play();
  $('#bCam').textContent = '✖ Fechar câmera';
  // leitor nativo quando existe (Chrome/Android); senão a biblioteca jsQR (iPhone, Safari, computador)
  const nativo = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
  if (!nativo) await carregarJsQR();
  const tela = document.createElement('canvas'), ctx = tela.getContext('2d', { willReadFrequently: true });
  const achou = (valor) => { fecharCamera(); $('#codigo').value = valor; navigator.vibrate?.(60); return baixar(valor); };
  const laco = async () => {
    if (!stream) return;
    try {
      if (nativo) { const [c] = await nativo.detect(v); if (c) return achou(c.rawValue); }
      else if (v.videoWidth) {
        const w = Math.min(640, v.videoWidth), h = Math.round(w * v.videoHeight / v.videoWidth); tela.width = w; tela.height = h; ctx.drawImage(v, 0, 0, w, h);
        const c = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' }); if (c?.data) return achou(c.data);
      }
    } catch {}
    setTimeout(laco, nativo ? 250 : 200);
  };
  laco(); });
// leitor de código de barras USB/Bluetooth digita o código e dá Enter: confere sozinho
$('#codigo').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); baixar($('#codigo').value.trim()); } });

async function iniciar() { if (!token) return Mukifo.pedir(() => { token = Mukifo.token(); iniciar(); });
  cardapio = (await (await fetch('/api/venda/cardapio', { cache: 'no-store' })).json()).categorias; desenharCardapio();
  try { maqs = (await api('/api/venda/maquininhas')).maquininhas; } catch {} await lerComandas(); atualizarResumo(); lerRetiradas().catch(() => {}); }
iniciar().catch((e) => msg(e.message, true));
setInterval(() => { if (!document.hidden && token && !$('#dCobrar').open && !emVoo && !pend.size && !atual?.provisoria) { recarregarCardapio(); lerComandas().catch(() => {}); lerRetiradas().catch(() => {}); } }, 15000);
</script></body></html>
